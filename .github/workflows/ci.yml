name: Track 3 CI

# Each track repo's root IS the public folder, so all paths below are root-relative.
on:
  push:
    branches: [main, "task/**", "track3/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      diagnose_native:
        description: "Measure frozen v2 stages on native amd64 (diagnostic only, no image publication)"
        type: boolean
        default: false
      build_native:
        description: "Rebuild, test and export native modules on the fixed runtime"
        type: boolean
        default: false
      candidate_image:
        description: "Immutable candidate image for native qualification (empty runs CI only)"
        type: string
        required: false
      baseline_image:
        description: "Qualified immutable B0 image for paired screening or confirmation"
        type: string
        required: false
      hypothesis:
        description: "Predeclared change being tested against B0"
        type: string
        default: "Qualify the repaired exact CPU baseline"
      reference_image:
        description: "Immutable ABIDES reference image for parameter differentials"
        type: string
        required: false
      measurement_purpose:
        description: "Screen first; confirmation requires B0 and a fresh candidate"
        type: choice
        options: [screen, baseline, confirmation]
        default: screen

env:
  # The single place this workflow names a toolkit revision. Both jobs that install
  # `qfbench2-common` read it, so a bump is a one-line change and the two can never drift.
  #
  # This is the release TAG of Agenthon-2026/Agenthon2026-public that carries the frozen
  # contract set, and it is the SAME string the README's install command pins. It must stay a
  # tag and never a branch: an unpinned toolkit means a local result and a scored result can
  # diverge silently, which is the one failure mode the pin exists to prevent.
  QFBENCH2_COMMON_REF: v2.4.3

jobs:
  native-diagnosis:
    name: Diagnose frozen v2 on native amd64
    if: github.event_name == 'workflow_dispatch' && inputs.diagnose_native
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install output footer reader
        run: python -m pip install "pyarrow>=12"
      - name: Generate separate diagnostic extensions
        run: |
          python scripts/diagnostics/instrument_native.py --source baselines/fast_sim/_native.pyx --out out/diagnostic-build/fast_sim/_native_diagnostic.pyx --mode stage
          python scripts/diagnostics/instrument_native.py --source baselines/fast_sim/_native.pyx --out out/diagnostic-build/fast_sim/_native_profile.pyx --mode profile
          cp scripts/diagnostics/setup.py out/diagnostic-build/setup.py
      - name: Build instrumentation beside the published native module
        run: |
          docker pull ghcr.io/youxuanxue/track3-simulation-public@sha256:7312745e1c9a09cb898402e74a5d18b83cbfb6b5372a3739464a9c01e6e84259
          docker build --platform linux/amd64 -f scripts/diagnostics/Dockerfile -t track3-diagnosis:local out/diagnostic-build
      - name: Measure unchanged CLI, exact stages and instrumented call attribution
        run: python scripts/diagnostics/run_diagnosis.py run --image track3-diagnosis:local --out out/native-diagnosis --repeats 3 --stage-repeats 5
      - name: Retain diagnostic evidence and source manifests
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-diagnosis-${{ github.run_id }}
          path: |
            out/native-diagnosis/
            out/diagnostic-build/fast_sim/*.json
          if-no-files-found: error
          retention-days: 30
  # Runs FIRST and does not install the shared toolkit, so it survives anything that can go
  # wrong with that install below (an unresolvable ref, a bad tag, a network failure). Steps
  # after a failed install are SKIPPED, so any check placed behind one silently does not run
  # in exactly the case that matters most. Everything here needs only the stdlib plus pyarrow,
  # which is plain PyPI.
  firewall:
    name: Firewall + integrity guards (no secret — runs on forks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        # No lfs: these guards read cards and build their own fixtures. The manifest
        # sha256/bytes check that needs real parquet content stays in validate-units.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
      - name: Install pyarrow (no token required)
        run: |
          python -m pip install --upgrade pip
          pip install "pyarrow>=12"
      - name: Card, track, split and canary checks
        run: python .github/validate_units.py simulation --stdlib-only
      # These three moved here from lint-type, whose first step installs the shared toolkit
      # -- so a failed install skipped them, despite their own comment correctly noting they
      # are stdlib + pyarrow only. They guard the award-integrity contract and host-side
      # event counting, which is precisely what must not be skippable.
      - name: Award-integrity tests
        run: python tests/test_award_integrity.py
      - name: Unit-runner tests (routing, staging, host counting, node fingerprint)
        run: python tests/test_run_unit.py
      - name: Verb-dispatch tests (simulate vs simulate-batch)
        run: python tests/test_verb_dispatch.py
      # Same rationale: the ranked events/sec must come from the harness measurement when one
      # exists, because wall_clock_sec in a submission's own events.json is checked against
      # nothing. That guard must not be skippable on a fork PR either. Loads host_metrics.py
      # straight from its file, so it needs no toolkit and not even pyarrow.
      # The ranked events/sec must come from the trusted C2 record. This guard now asserts the
      # REMOVAL of the participant-rate fallback -- `resolve()`, `strict_mode()` and the
      # QFB2_T3_REQUIRE_HOST_TELEMETRY flag are gone -- and that everything the developer profile
      # emits says rankable=false. Loads host_metrics.py straight from its file, so it needs no
      # toolkit and not even pyarrow, and must not be skippable on a fork PR.
      - name: Developer-profile guard (no rankable self-report fallback)
        run: python tests/test_host_metrics.py
      - name: Standalone timer JSON profile (stdlib only, no Docker)
        run: python tests/test_timer_profile.py
      # Card drift guard. Cards are GENERATED, so a value edited in units/ but not in the generator
      # survives only until the next regeneration -- which is how every card came to carry
      # `gpu = true` while both generators still emitted `false`. Stdlib-only; its one
      # toolkit-backed check (cluster_key) skips loudly here and runs in lint-type below.
      - name: Card invariants (GPU contract, ledger declaration, generator drift)
        run: python tests/test_unit_cards.py
      # The README's quick start is executable documentation, so it is executed. Two published
      # commands shipped broken: `pip install -e ".[all]"` from the ABIDES root (exit 1, no
      # top-level project) and three `timer.py` invocations missing the `--scenario` its own parser
      # marks required (exit 2). Both are now parsed by the real CLI rather than trusted as prose.
      # Stdlib-only (the timer's parser is loaded from its file), so it belongs in this
      # no-secret job.
      - name: README command guards (published commands parse; toolkit caveat present)
        run: python tests/test_readme_commands.py

  lint-type:
    name: Lint + type check (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
      - name: Install tools + shared toolkit
        run: |
          python -m pip install --upgrade pip
          # mypy 1.13.0 is the earliest release that type-checks numpy 2.x correctly: 1.10.0 reads
          # npt.NDArray as a variable rather than a type alias and misreads the np.histogram result,
          # which produces spurious errors once the toolkit resolves numpy 2.x. Smallest bump that
          # checks the tree clean. Keep in sync with the [dev] extra.
          # pandas is the toolkit's [data] extra, not a base dependency, so it is named explicitly:
          # the batch isolation gate imports it, and its tests run in this job.
          # pytest and scipy are named explicitly: the gates below are pytest modules and
          # the semantic checks use scipy's two-sample KS. Leaving either to be pulled in
          # transitively is how a job starts passing for the wrong reason.
          pip install "ruff==0.4.7" "mypy==1.13.0" "pyarrow>=12" "pandas>=2.2" \
                      "scipy>=1.10" "pytest>=8"
          # Participant-facing CI installs the toolkit ANONYMOUSLY from the public toolkit
          # repository, with no credential. That is what lets this job run on fork pull
          # requests: GitHub withholds repository secrets from forks, so an install gated on
          # one dies at `pip install` before any check is reached. Nothing here needs the
          # private hub — `qfbench2-common` is published from Agenthon2026-public/common.
          pip install "qfbench2-common @ git+https://github.com/Agenthon-2026/Agenthon2026-public.git@${{ env.QFBENCH2_COMMON_REF }}#subdirectory=common"
      - name: Ruff lint
        run: ruff check qfbench2_track_simulation throughput regression_suite baselines/abides_fork
      - name: Participant submission preparation
        run: PYTHON=python bash scripts/preflight.sh
      - name: Ruff format check
        run: ruff format --check qfbench2_track_simulation throughput regression_suite baselines/abides_fork
      - name: Mypy (strict)
        run: mypy --strict --ignore-missing-imports qfbench2_track_simulation throughput regression_suite/run_regression.py baselines/abides_fork
      # Guard the batch isolation gate's ledger split: self-consistency is candidate-only and must
      # run on EVERY sub, while reference-equivalence runs only where a reference ledger ships. This
      # one cannot join the `firewall` job -- importing qfbench2_track_simulation.batch pulls in the
      # package __init__, hence .scoring, hence the shared toolkit.
      # These gates all import qfbench2_track_simulation, so they cannot join the
      # `firewall` job -- the package __init__ pulls in .scoring and therefore the shared
      # toolkit. That is fine and is NOT a skipped-green risk: this job installs the toolkit as its
      # first step, so a failed toolkit install fails RED at that step rather than skipping.
      - name: Batch isolation tests (ledger by declaration, not by file existence)
        run: python tests/test_batch_isolation.py
      - name: Ranked-timing tests (C2/C7 binding, every repeat validated, no fallback)
        run: python -m pytest tests/test_telemetry_binding.py -q
      - name: Semantic exactness tests (no intersection, no prefix, no truncation, no NaN)
        run: python -m pytest tests/test_semantics_exactness.py -q
      - name: Baseline clock compatibility and Tier-A RNG guidance
        run: python -m pytest tests/test_tier_a_rng_contract.py -q
      - name: Message-ledger completeness tests (card declaration, reference-relative floor)
        run: python -m pytest tests/test_ledger_completeness.py -q
      - name: Clip-ceiling derivation tests (the C1 metric domain)
        run: python -m pytest tests/test_domain_ceiling.py -q
      - name: Scoring-gate tests (two named factories, organizer faults, contained parsers)
        run: python -m pytest tests/test_scoring_gate.py -q
      - name: Malicious-output tests (shared adversarial corpus + Track 3 allowlist)
        run: python -m pytest tests/test_malicious_output.py -q
      - name: Contract-boundary tests (Hub C1/C2/C5/C7 fixtures)
        run: python -m pytest tests/test_contract_boundary.py -q
      - name: Shared scorer version (pyproject <-> SCORER_VERSION <-> package)
        run: python -m pytest tests/test_scorer_version.py -q
      # Re-run with the toolkit present so the cluster_key check actually executes: it imports
      # qfbench2_track_simulation, so in the firewall job it reports SKIP rather than running.
      # QFB2_T3_REQUIRE_TOOLKIT turns that SKIP into a FAILURE here, because in this job the
      # dependency IS installed -- a check that reports SKIP is not a check that passed, and a
      # summary line counting it as one is the skipped-green defect in miniature.
      - name: Card invariants incl. cluster_key (toolkit present, skips are failures)
        env:
          QFB2_T3_REQUIRE_TOOLKIT: "1"
        run: python tests/test_unit_cards.py
      # The award-integrity, unit-runner and verb-dispatch guards moved to the `firewall`
      # job above. They are stdlib + pyarrow, as the comment here always said -- but this
      # job's first step installs the shared toolkit, so a failed install skipped them.

  # The toolkit-backed half. Every check here sits behind the toolkit install and disappears
  # if that install breaks, which is why the firewall job above exists — do not fold these
  # back together.
  validate-units:
    name: Validate units (+ manifests · public-safety)
    needs: firewall
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          lfs: true  # units' *.parquet are lfs-tracked; the manifest sha256/bytes check needs the
                     # real content, not the 131-byte pointer stubs (the lint job needs no lfs).
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
      - name: Install shared toolkit
        run: |
          python -m pip install --upgrade pip
          # pandas/pyarrow/pytest are named for the corpus acceptance step below, not for
          # validate_units.py, which is stdlib-only. Same reason the lint job names them: leaving
          # either to arrive transitively is how a job starts passing for the wrong reason.
          pip install "pyarrow>=12" "pandas>=2.2" "scipy>=1.10" "pytest>=8"
          # Public toolkit repository, no credential — see the note in the lint-type job.
          pip install "qfbench2-common @ git+https://github.com/Agenthon-2026/Agenthon2026-public.git@${{ env.QFBENCH2_COMMON_REF }}#subdirectory=common"
      - name: Validate all public units
        run: python .github/validate_units.py simulation
      # The acceptance test for the candidate-side ledger gate: every shipped reference ledger must
      # pass it, because a perfect submission emits exactly the reference. It reads units/*.parquet,
      # so it belongs in THIS job -- the lint job checks out without lfs and sees pointer stubs,
      # where the same test skips. QFB2_T3_REQUIRE_LFS turns that skip into a failure here, since
      # this job fetched the corpus and a skip would mean the acceptance evidence never ran.
      - name: Reference-ledger acceptance (candidate gate admits every shipped reference)
        env:
          QFB2_T3_REQUIRE_LFS: "1"
        run: python -m pytest tests/test_ledger_completeness.py -q

  native-build:
    name: Build and verify native candidate
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.build_native)
    needs: [firewall, lint-type, validate-units]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      IMAGE: ghcr.io/${{ github.repository }}:native-${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          lfs: true
      - name: Rebuild native extensions on the fixed runtime
        run: docker build --platform linux/amd64 -f baselines/Dockerfile.native-candidate -t "$IMAGE" .
      - name: Exact streaming differentials in the candidate image
        run: docker run --rm --network none --cpus 4 --memory 4g -v "$PWD:/workspace:ro" "$IMAGE" python /workspace/tests/integration/native_streaming_check.py
      - name: Export tested native modules and build identity
        run: |
          mkdir -p native-overlay
          container_id="$(docker create "$IMAGE")"
          docker cp "$container_id:/opt/fast_sim" native-overlay/fast_sim
          docker cp "$container_id:/opt/abides_fork" native-overlay/abides_fork
          docker rm "$container_id"
          docker image inspect "$IMAGE" > native-overlay/image.json
          python - <<'PYCODE'
          import hashlib, json, os
          from pathlib import Path
          root = Path('native-overlay')
          hashes = {str(p.relative_to(root)): hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob('*')) if p.is_file()}
          (root/'build.json').write_text(json.dumps({'source_commit': os.environ['GITHUB_SHA'], 'rankable': False, 'files': hashes}, indent=2)+'\n')
          PYCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-image-${{ github.run_id }}
          path: native-overlay/

  native-qualification:
    name: Native candidate qualification (non-rankable)
    if: github.event_name == 'workflow_dispatch' && inputs.candidate_image != ''
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    concurrency:
      group: t3-native-${{ github.ref }}
      cancel-in-progress: false
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          lfs: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install pinned verifier
        run: |
          python -m pip install "qfbench2-common[data] @ git+https://github.com/Agenthon-2026/Agenthon2026-public.git@${{ env.QFBENCH2_COMMON_REF }}#subdirectory=common" scipy
      - name: Record actual instance and pull immutable images
        env:
          CANDIDATE_IMAGE: ${{ inputs.candidate_image }}
          BASELINE_IMAGE: ${{ inputs.baseline_image }}
          MEASUREMENT_PURPOSE: ${{ inputs.measurement_purpose }}
          REFERENCE_IMAGE: ${{ inputs.reference_image }}
        run: |
          if [ "$MEASUREMENT_PURPOSE" = confirmation ] && [ -z "$BASELINE_IMAGE" ]; then
            echo 'Confirmation requires a qualified baseline image' >&2
            exit 1
          fi
          if [ "$MEASUREMENT_PURPOSE" = baseline ] && [ -n "$BASELINE_IMAGE" ]; then
            echo 'Baseline qualification accepts one image' >&2
            exit 1
          fi
          if [ "$CANDIDATE_IMAGE" = "$BASELINE_IMAGE" ]; then
            echo 'Paired experiments require different images' >&2
            exit 1
          fi
          mkdir -p out/native
          docker info --format '{{json .}}' > out/native/docker-info.json
          uname -a > out/native/uname.txt
          free -b > out/native/memory.txt
          docker pull "$CANDIDATE_IMAGE"
          docker pull "$REFERENCE_IMAGE"
          if [ -n "$BASELINE_IMAGE" ]; then docker pull "$BASELINE_IMAGE"; fi
          python scripts/benchmark_candidates.py freeze --image "$CANDIDATE_IMAGE" --purpose baseline --round B0-native --hypothesis 'Qualify the repaired exact CPU baseline' --budget 18000 --history out/native/history --out out/native/probe-plan.json
      - name: Restore unresolved failures from the prior native artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/restore_candidate_history.py --repo "$GITHUB_REPOSITORY" --branch "$GITHUB_REF_NAME" --current-run "$GITHUB_RUN_ID" --out out/native/history
      - name: Independent public parameter differentials
        env:
          CANDIDATE_IMAGE: ${{ inputs.candidate_image }}
          BASELINE_IMAGE: ${{ inputs.baseline_image }}
          REFERENCE_IMAGE: ${{ inputs.reference_image }}
        run: |
          python scripts/validate_candidate_parameters.py generate --seed "$((GITHUB_RUN_ID % 1000000000))" --reference-image "$REFERENCE_IMAGE" --out out/native/holdouts
          python scripts/validate_candidate_parameters.py run --plan out/native/holdouts/holdout.json --image "$CANDIDATE_IMAGE" --out out/native/parameters
          if [ -n "$BASELINE_IMAGE" ]; then
            python scripts/validate_candidate_parameters.py run --plan out/native/holdouts/holdout.json --image "$BASELINE_IMAGE" --out out/native/parameters-baseline
          fi
          python - <<'PYCODE'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          import benchmark_candidates as b
          import validate_candidate_parameters as p
          import json
          heldouts = {}
          for folder in ('parameters', 'parameters-baseline'):
              path = Path('out/native') / folder / 'heldout-result.json'
              if path.exists():
                  result = json.loads(path.read_text())
                  p.validate(result, result['image'])
                  heldouts[result['image']] = b.index(path)
          b.save(Path('out/native/holdout-index.json'), heldouts)
          PYCODE
      - name: Preserve parameter evidence before long measurement
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-parameters-${{ github.run_id }}
          path: out/native/
          retention-days: 30
      - name: Freeze native experiment and export confirmation reservation
        env:
          CANDIDATE_IMAGE: ${{ inputs.candidate_image }}
          BASELINE_IMAGE: ${{ inputs.baseline_image }}
          HYPOTHESIS: ${{ inputs.hypothesis }}
          MEASUREMENT_PURPOSE: ${{ inputs.measurement_purpose || 'screen' }}
        run: |
          if [ "$MEASUREMENT_PURPOSE" = screen ]; then
            run_budget=1200
            unit_timeout=120
          else
            run_budget=18000
            # The full exemplar's classification pass can outlast the old 30m
            # developer deadline. Keep the whole experiment bounded separately.
            unit_timeout=7200
          fi
          baseline_args=()
          if [ -n "$BASELINE_IMAGE" ]; then baseline_args=(--baseline "$BASELINE_IMAGE"); fi
          python scripts/benchmark_candidates.py freeze --image "$CANDIDATE_IMAGE" "${baseline_args[@]}" --purpose "$MEASUREMENT_PURPOSE" --round "$MEASUREMENT_PURPOSE-native" --hypothesis "$HYPOTHESIS" --timeout "$unit_timeout" --budget "$run_budget" --history out/native/history --holdout out/native/holdout-index.json --out out/native/plan.json
          if [ "$MEASUREMENT_PURPOSE" = confirmation ]; then
            python scripts/benchmark_candidates.py export-confirmation --plan out/native/plan.json --out out/native/reservations
          fi
      - name: Preserve confirmation opportunity before any measured invocation
        if: inputs.measurement_purpose == 'confirmation'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-reservations-${{ github.run_id }}
          path: out/native/reservations/
          if-no-files-found: error
          retention-days: 90
      - name: Bounded native measurement with kernel memory telemetry
        run: |
          sudo mkdir -p /mnt/t3-scratch
          sudo mount -t tmpfs -o size=10G,nodev,nosuid,mode=1777 t3-scratch /mnt/t3-scratch
          python scripts/benchmark_candidates.py run --plan out/native/plan.json --scratch-volume /mnt/t3-scratch --out out/native/runs
          python scripts/benchmark_candidates.py assess --evidence out/native/runs/evidence.json > out/native/assessment.json
          python - <<'PYCODE'
          import json
          from pathlib import Path
          result = json.loads(Path('out/native/assessment.json').read_text())
          gate = {'screen': 'screen_status', 'baseline': 'G2', 'confirmation': 'G3'}[result['purpose']]
          assert result[gate] == 'pass', result['reasons']
          PYCODE
      - name: Retain small failure history for the next native job
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-history-${{ github.run_id }}
          path: out/native/history/
          retention-days: 90
      - name: Retain raw qualification evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-qualification-${{ github.run_id }}
          path: out/native/
          retention-days: 30
